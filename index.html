<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silent Auction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0C0A; --bg2:#151210; --surface:#1B1815; --surface2:#221E19;
    --border:#2E2820; --cream:#F3EBDA; --text:#F3EBDA; --muted:#9C9082;
    --gold:#E3B75C; --green:#7FBF8E; --red:#D9836E;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);height:100%;
    font-family:'IBM Plex Sans',sans-serif;-webkit-tap-highlight-color:transparent;}
  .serif{font-family:'Newsreader',serif;}
  a{color:inherit;}
  button{font-family:inherit;}
  img{display:block;}
  svg{display:block;flex:none;}

  .view{display:none;min-height:100vh;min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));}
  .view.active{display:block;}

  /* ---------- shared bits ---------- */
  .icon-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    color:var(--text);cursor:pointer;flex:none;}
  .badge{display:inline-block;padding:5px 11px;font-size:11px;border:1px solid var(--border);
    border-radius:20px;color:var(--muted);background:var(--surface);}
  .cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:15px;border:none;border-radius:12px;font-weight:600;font-size:15px;cursor:pointer;}
  .cta-cream{background:var(--cream);color:#1B140A;}
  .cta-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .cta[disabled]{opacity:.4;pointer-events:none;}

  /* ---------- Home ---------- */
  #view-home .top{padding:calc(20px + env(safe-area-inset-top,0px)) 20px 4px;
    display:flex;align-items:center;justify-content:space-between;}
  .wordmark{font-size:20px;letter-spacing:.06em;font-weight:600;}
  .searchbar{margin:10px 20px 0;display:none;}
  .searchbar.open{display:block;}
  .searchbar input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:14px;}
  .pills{display:flex;gap:8px;overflow-x:auto;padding:16px 20px;scrollbar-width:none;}
  .pills::-webkit-scrollbar{display:none;}
  .pill{flex:none;padding:9px 16px;border-radius:20px;border:1px solid var(--border);
    background:var(--surface);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;}
  .pill.on{background:var(--cream);color:#1B140A;border-color:var(--cream);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 20px 20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;}
  .card .img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--surface2);}
  .card .body{padding:10px 12px 13px;}
  .card .title{font-size:14px;font-weight:600;margin:0 0 6px;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card .price{font-size:14px;font-weight:600;margin:0 0 2px;}
  .card .left{font-size:11px;color:var(--muted);}
  .empty-state{padding:60px 24px;text-align:center;color:var(--muted);}

  /* ---------- Item detail ---------- */
  #view-item .hero-wrap{position:relative;}
  .hero-img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--surface2);}
  .hero-nav{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:16px;right:16px;
    display:flex;justify-content:space-between;}
  #view-item .body{padding:20px;}
  .item-title{font-size:22px;font-weight:600;margin:0 0 4px;line-height:1.25;}
  .item-sub{font-size:13px;color:var(--muted);margin:0 0 14px;}
  .badges{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .item-desc{font-size:14px;line-height:1.6;color:#D9D0C0;margin-bottom:20px;}
  .stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);padding:16px 0;margin-bottom:90px;}
  .stat-row .stat .k{font-size:11px;color:var(--muted);margin:0 0 4px;}
  .stat-row .stat .v{font-size:16px;font-weight:600;}
  .stat-row .stat .v.gold{color:var(--gold);}
  .item-cta-bar{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg,transparent,var(--bg) 30%);z-index:6;}
  .closed-note{text-align:center;font-size:13px;color:var(--muted);padding:14px;
    background:var(--surface);border:1px solid var(--border);border-radius:12px;}

  /* ---------- Bid sheet ---------- */
  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;}
  .sheet-backdrop.open{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:-100%;background:var(--bg2);border-top:1px solid var(--border);
    border-radius:20px 20px 0 0;z-index:21;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));
    transition:bottom .28s ease;max-height:85vh;overflow-y:auto;}
  .sheet.open{bottom:0;}
  .sheet-head{display:flex;gap:12px;align-items:center;margin-bottom:18px;}
  .sheet-head img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--surface2);flex:none;}
  .sheet-head .t{font-weight:600;font-size:15px;}
  .sheet-head .s{font-size:12px;color:var(--muted);}
  .sheet-close{margin-left:auto;}
  .sheet-current{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:14px;margin-bottom:16px;}
  .sheet-current .k{font-size:12px;color:var(--muted);margin:0 0 4px;}
  .sheet-current .v{font-size:22px;font-weight:600;}
  .sheet-min{font-size:12px;color:var(--muted);margin-top:8px;}
  .amount-field{display:flex;align-items:center;gap:8px;border:1px solid var(--border);
    border-radius:12px;padding:14px;margin:16px 0 10px;background:var(--surface);}
  .amount-field span{color:var(--muted);font-size:18px;}
  .amount-field input{flex:1;background:none;border:none;color:var(--text);font-size:20px;
    font-weight:600;outline:none;width:100%;}
  .quick-row{display:flex;gap:8px;margin-bottom:16px;}
  .quick-btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;}
  .biddername{display:flex;justify-content:space-between;align-items:center;font-size:13px;
    color:var(--muted);margin-bottom:16px;padding:0 2px;}
  .biddername button{background:none;border:none;color:var(--gold);text-decoration:underline;
    font-size:12px;cursor:pointer;}
  .name-edit{display:none;margin-bottom:16px;}
  .name-edit.open{display:block;}
  .name-edit input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:14px;}
  .sheet-err{color:var(--red);font-size:13px;margin-top:10px;min-height:16px;}

  /* ---------- Success ---------- */
  .success-overlay{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;
    flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;
    overflow:hidden;}
  .success-overlay.open{display:flex;}
  .success-badge{position:relative;width:88px;height:88px;border-radius:50%;background:var(--gold);
    display:flex;align-items:center;justify-content:center;margin-bottom:24px;}
  .spark{position:absolute;color:var(--gold);opacity:.8;}
  .success-overlay h1{font-size:24px;margin:0 0 10px;}
  .success-overlay p{font-size:14px;color:var(--muted);max-width:300px;line-height:1.5;margin:0 0 28px;}
  .success-actions{width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px;}
  .link-btn{background:none;border:none;color:var(--muted);text-decoration:underline;
    font-size:14px;cursor:pointer;padding:8px;}

  /* ---------- My Bids ---------- */
  #view-mybids .top, #view-profile .top{padding:calc(20px + env(safe-area-inset-top,0px)) 20px 16px;}
  #view-mybids .top h1, #view-profile .top h1{font-size:22px;margin:0;}
  .tabs{display:flex;gap:6px;padding:0 20px 16px;}
  .tab{flex:1;text-align:center;padding:10px 6px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;}
  .tab.on{background:var(--cream);color:#1B140A;border-color:var(--cream);}
  .biditem{display:flex;gap:12px;align-items:center;margin:0 20px 12px;padding:12px;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;cursor:pointer;}
  .biditem img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--surface2);flex:none;}
  .biditem .b{flex:1;min-width:0;}
  .biditem .t{font-weight:600;font-size:14px;margin:0 0 4px;}
  .biditem .p{font-size:14px;font-weight:600;}
  .biditem .s{font-size:12px;color:var(--muted);margin-top:2px;}
  .biditem .s.won{color:var(--green);}
  .biditem .s.lost{color:var(--red);}
  .biditem .chev{color:var(--muted);}

  /* ---------- Profile ---------- */
  .profile-card{margin:0 20px 16px;padding:18px;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;}
  .profile-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;
    border-bottom:1px solid var(--border);font-size:14px;}
  .profile-row:last-child{border-bottom:none;}
  .profile-row .k{color:var(--muted);font-size:12px;}
  .profile-input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface2);color:var(--text);font-size:14px;margin-top:6px;}
  .adminlink{display:block;text-align:center;margin-top:30px;font-size:12px;color:var(--muted);}

  /* ---------- Bottom nav ---------- */
  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg2);
    border-top:1px solid var(--border);display:flex;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));}
  /* The item view's own CTA bar (Place a Bid / closed note) sits at the
     same fixed bottom:0 spot as the tab bar. Without this, the tab bar's
     higher z-index silently covers it — the button was rendering, just
     hidden underneath the always-on nav. Hide the tab bar on this view
     since the CTA bar replaces it there. */
  #view-item.active ~ .bottomnav{display:none;}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    background:none;border:none;color:var(--muted);font-size:11px;padding:6px;cursor:pointer;}
  .navbtn.on{color:var(--cream);}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<section class="view active" id="view-home">
  <div class="top">
    <div class="wordmark serif" id="event-name">JASHN</div>
    <button class="icon-btn" id="search-toggle"></button>
  </div>
  <div class="searchbar" id="searchbar"><input id="search-input" placeholder="Search items…"></div>
  <div class="pills" id="pills"></div>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="empty-state" style="display:none;">No lots yet — check back shortly.</div>
</section>

<!-- ============ ITEM DETAIL ============ -->
<section class="view" id="view-item">
  <div class="hero-wrap">
    <img class="hero-img" id="item-img">
    <div class="hero-nav">
      <button class="icon-btn" id="item-back"></button>
      <button class="icon-btn" id="item-share"></button>
    </div>
  </div>
  <div class="body">
    <h1 class="item-title serif" id="item-title"></h1>
    <p class="item-sub" id="item-lotnum"></p>
    <div class="badges" id="item-badges"></div>
    <p class="item-desc" id="item-desc"></p>
    <div class="stat-row">
      <div class="stat"><p class="k" id="item-bid-label">Current Bid</p><p class="v gold" id="item-bid-value"></p></div>
      <div class="stat"><p class="k">Time Left</p><p class="v" id="item-time-value">—</p></div>
      <div class="stat"><p class="k">Total Bids</p><p class="v" id="item-bidcount-value">0</p></div>
    </div>
  </div>
  <div class="item-cta-bar" id="item-cta-bar"></div>
</section>

<!-- ============ MY BIDS ============ -->
<section class="view" id="view-mybids">
  <div class="top"><h1 class="serif">My Bids</h1></div>
  <div class="tabs" id="mybids-tabs">
    <button class="tab on" data-tab="active">Active</button>
    <button class="tab" data-tab="won">Won</button>
    <button class="tab" data-tab="lost">Lost</button>
  </div>
  <div id="mybids-list"></div>
  <div class="empty-state" id="mybids-empty" style="display:none;">Nothing here yet.</div>
</section>

<!-- ============ PROFILE ============ -->
<section class="view" id="view-profile">
  <div class="top"><h1 class="serif">Profile</h1></div>
  <div class="profile-card">
    <label class="k" style="font-size:12px;color:var(--muted);">Your name (used on bids)</label>
    <input class="profile-input" id="profile-name">
  </div>
  <div class="profile-card" id="profile-google"></div>
  <div class="profile-card">
    <button class="cta cta-outline" id="clear-bids-btn">Clear my bid history on this device</button>
  </div>
  <a class="adminlink" href="admin.html">Auction organizer? Open admin</a>
</section>

<!-- ============ Bottom nav ============ -->
<nav class="bottomnav">
  <button class="navbtn on" data-view="home" id="nav-home"></button>
  <button class="navbtn" data-view="mybids" id="nav-mybids"></button>
  <button class="navbtn" data-view="profile" id="nav-profile"></button>
</nav>

<!-- ============ Bid sheet ============ -->
<div class="sheet-backdrop" id="sheet-backdrop"></div>
<div class="sheet" id="bidsheet">
  <div class="sheet-head">
    <img id="sheet-img">
    <div><div class="t" id="sheet-title"></div><div class="s" id="sheet-lot"></div></div>
    <button class="icon-btn sheet-close" id="sheet-close"></button>
  </div>
  <div class="sheet-current">
    <p class="k">Current Bid</p>
    <p class="v" id="sheet-current-bid"></p>
    <p class="sheet-min" id="sheet-min-text"></p>
  </div>
  <div class="amount-field"><span>₹</span><input id="sheet-amount" type="number" inputmode="numeric"></div>
  <div class="quick-row" id="sheet-quick"></div>
  <div class="biddername">
    <span>Bidding as <strong id="sheet-name-display"></strong></span>
    <button id="sheet-name-change">Change</button>
  </div>
  <div class="name-edit" id="sheet-name-edit"><input id="sheet-name-input" placeholder="Full name" maxlength="79"></div>
  <button class="cta cta-cream" id="sheet-confirm">Confirm Bid</button>
  <div class="sheet-err" id="sheet-err"></div>
</div>

<!-- ============ Success ============ -->
<div class="success-overlay" id="success-overlay">
  <div class="success-badge" id="success-badge"></div>
  <h1 class="serif">Bid Placed Successfully!</h1>
  <p id="success-msg"></p>
  <div class="success-actions">
    <button class="cta cta-cream" id="success-view">View Item</button>
    <button class="link-btn" id="success-browse">Keep Browsing</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-init.js"></script>
<script>
// -----------------------------------------------------------------
// Icons — small inline SVGs, stroke = currentColor
// -----------------------------------------------------------------
const ICONS = {
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  close: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  share: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 15v3a2 2 0 002 2h10a2 2 0 002-2v-3"/></svg>',
  check: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1B140A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  chev: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  home: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/></svg>',
  tag: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 12.6L12.6 20.6a2 2 0 01-2.8 0L3 13.8V4a1 1 0 011-1h9.8a2 2 0 011.4.6l5.4 5.4a2 2 0 010 2.8z"/><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none"/></svg>',
  user: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>',
  spark: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>',
};
function setIcon(id, name) { document.getElementById(id).innerHTML = ICONS[name]; }

// -----------------------------------------------------------------
// State + navigation
// -----------------------------------------------------------------
const EVENT_NAME = document.getElementById('event-name').textContent; // rename in the HTML if you like
let lots = [];
let activeCategory = 'All';
let searchTerm = '';
let currentItemId = null;
let googleUser = null;
let itemCountdownTimer = null;
let gridCountdownTimer = null;
let mybidsTab = 'active';

setIcon('search-toggle', 'search');
setIcon('item-back', 'back');
setIcon('item-share', 'share');
setIcon('sheet-close', 'close');
setIcon('nav-home', 'home');
setIcon('nav-mybids', 'tag');
setIcon('nav-profile', 'user');
setIcon('success-badge', 'check');
document.getElementById('nav-home').insertAdjacentHTML('beforeend', '<span>Home</span>');
document.getElementById('nav-mybids').insertAdjacentHTML('beforeend', '<span>My Bids</span>');
document.getElementById('nav-profile').insertAdjacentHTML('beforeend', '<span>Profile</span>');
// A few decorative sparkles around the success checkmark, like the reference.
['top:-10px;left:-16px;', 'bottom:0;right:-20px;', 'top:20px;right:-24px;'].forEach(pos => {
  document.getElementById('success-badge').insertAdjacentHTML('beforeend',
    `<span class="spark" style="${pos}">${ICONS.spark}</span>`);
});

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('on', b.dataset.view === name));
  if (name !== 'item' && itemCountdownTimer) { clearInterval(itemCountdownTimer); itemCountdownTimer = null; }
  if (name === 'mybids') renderMyBids();
  if (name === 'profile') renderProfile();
  window.scrollTo(0, 0);
}
document.querySelectorAll('.navbtn').forEach(b => b.onclick = () => showView(b.dataset.view));

// -----------------------------------------------------------------
// Auth
// -----------------------------------------------------------------
auth.getRedirectResult().then(res => { if (res.user) { googleUser = res.user; renderProfile(); } }).catch(() => {});
auth.onAuthStateChanged(u => { googleUser = u || null; renderProfile(); });

// -----------------------------------------------------------------
// Load lots
// -----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const directId = params.get('id');
let openedDirect = false;

db.collection('items').orderBy('lotNumber').onSnapshot(snap => {
  lots = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderPills();
  renderGrid();
  if (document.getElementById('view-item').classList.contains('active') && currentItemId) {
    const it = lots.find(l => l.id === currentItemId);
    if (it) renderItemView(it);
  }
  if (document.getElementById('view-mybids').classList.contains('active')) renderMyBids();

  if (directId && !openedDirect) {
    const it = lots.find(l => l.id === directId);
    if (it) { openedDirect = true; openItem(it.id); }
  }
});

function renderPills() {
  const cats = ['All', ...new Set(lots.map(l => l.category).filter(Boolean))];
  document.getElementById('pills').innerHTML = cats.map(c =>
    `<button class="pill ${c === activeCategory ? 'on' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`
  ).join('');
  document.querySelectorAll('.pill').forEach(p => p.onclick = () => {
    activeCategory = p.dataset.cat;
    renderPills();
    renderGrid();
  });
}

function renderGrid() {
  let list = lots;
  if (activeCategory !== 'All') list = list.filter(l => (l.category || '') === activeCategory);
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    list = list.filter(l => (l.title || '').toLowerCase().includes(q) || (l.description || '').toLowerCase().includes(q));
  }
  const grid = document.getElementById('grid');
  document.getElementById('empty-state').style.display = list.length ? 'none' : 'block';
  grid.innerHTML = list.map(it => `
    <div class="card" data-id="${it.id}">
      <img class="img" src="${it.imageUrl || ''}" onerror="this.style.visibility='hidden'">
      <div class="body">
        <p class="title">${escapeHtml(it.title)}</p>
        <p class="price">${money(it.currentBid)}</p>
        <p class="left" data-endsat>${gridTimeLabel(it)}</p>
      </div>
    </div>`).join('');
  grid.querySelectorAll('.card').forEach(c => c.onclick = () => openItem(c.dataset.id));

  clearInterval(gridCountdownTimer);
  gridCountdownTimer = setInterval(() => {
    document.querySelectorAll('#grid .card').forEach(c => {
      const it = lots.find(l => l.id === c.dataset.id);
      if (it) c.querySelector('[data-endsat]').textContent = gridTimeLabel(it);
    });
  }, 30000);
}
function gridTimeLabel(it) {
  if (it.active === false) return 'Closed';
  return timeLeftText(it.endsAt) || 'Open';
}

document.getElementById('search-toggle').onclick = () => {
  const bar = document.getElementById('searchbar');
  bar.classList.toggle('open');
  if (bar.classList.contains('open')) document.getElementById('search-input').focus();
};
document.getElementById('search-input').addEventListener('input', (e) => {
  searchTerm = e.target.value;
  renderGrid();
});

// -----------------------------------------------------------------
// Item detail
// -----------------------------------------------------------------
function openItem(id) {
  currentItemId = id;
  const it = lots.find(l => l.id === id);
  if (!it) return;
  renderItemView(it);
  showView('item');
}
document.getElementById('item-back').onclick = () => showView('home');
document.getElementById('item-share').onclick = async () => {
  const url = location.origin + location.pathname + '?id=' + currentItemId;
  if (navigator.share) { navigator.share({ title: 'Silent Auction', url }).catch(() => {}); }
  else { await navigator.clipboard.writeText(url); alert('Link copied.'); }
};

function renderItemView(it) {
  const closed = it.active === false;
  document.getElementById('item-img').src = it.imageUrl || '';
  document.getElementById('item-title').textContent = it.title;
  document.getElementById('item-lotnum').textContent = 'LOT ' + String(it.lotNumber).padStart(3, '0');
  document.getElementById('item-desc').textContent = it.description || '';
  document.getElementById('item-badges').innerHTML = it.category ? `<span class="badge">${escapeHtml(it.category)}</span>` : '';
  document.getElementById('item-bid-label').textContent = closed ? 'Winning Bid' : 'Current Bid';
  document.getElementById('item-bid-value').textContent = money(it.currentBid);
  document.getElementById('item-bidcount-value').textContent = it.bidCount || 0;

  const timeEl = document.getElementById('item-time-value');
  clearInterval(itemCountdownTimer);
  const tick = () => { timeEl.textContent = closed ? 'Ended' : (timeLeftText(it.endsAt) || 'Open'); };
  tick();
  if (!closed && it.endsAt) itemCountdownTimer = setInterval(tick, 1000);

  const ctaBar = document.getElementById('item-cta-bar');
  ctaBar.innerHTML = closed
    ? `<div class="closed-note">Bidding closed — won by <strong>${escapeHtml(it.currentBidderName || '—')}</strong> at ${money(it.currentBid)}</div>`
    : `<button class="cta cta-cream" id="place-bid-btn">Place a Bid</button>`;
  const placeBtn = document.getElementById('place-bid-btn');
  if (placeBtn) placeBtn.onclick = () => openBidSheet(it);
}

// -----------------------------------------------------------------
// Bid sheet
// -----------------------------------------------------------------
let sheetItem = null;
const backdrop = document.getElementById('sheet-backdrop');
const sheet = document.getElementById('bidsheet');

function openBidSheet(it) {
  sheetItem = it;
  document.getElementById('sheet-img').src = it.imageUrl || '';
  document.getElementById('sheet-title').textContent = it.title;
  document.getElementById('sheet-lot').textContent = 'LOT ' + String(it.lotNumber).padStart(3, '0');
  document.getElementById('sheet-current-bid').textContent = money(it.currentBid);
  const minNext = it.currentBid + it.increment;
  document.getElementById('sheet-min-text').textContent = `Your bid must be at least ${money(minNext)}`;
  document.getElementById('sheet-amount').value = minNext;
  document.getElementById('sheet-quick').innerHTML = [it.increment, it.increment * 2, it.increment * 5]
    .map(v => `<button class="quick-btn" data-add="${v}">+${money(v)}</button>`).join('');
  document.querySelectorAll('.quick-btn').forEach(b => b.onclick = () => {
    const inp = document.getElementById('sheet-amount');
    inp.value = Number(inp.value || 0) + Number(b.dataset.add);
  });

  const savedName = localStorage.getItem('auction_name') || (googleUser ? (googleUser.displayName || '') : '');
  document.getElementById('sheet-name-input').value = savedName;
  document.getElementById('sheet-name-display').textContent = savedName || 'someone new';
  document.getElementById('sheet-name-edit').classList.toggle('open', !savedName);
  document.getElementById('sheet-err').textContent = '';

  backdrop.classList.add('open');
  sheet.classList.add('open');
}
document.getElementById('sheet-close').onclick = closeBidSheet;
backdrop.onclick = closeBidSheet;
function closeBidSheet() { backdrop.classList.remove('open'); sheet.classList.remove('open'); }

document.getElementById('sheet-name-change').onclick = () => {
  document.getElementById('sheet-name-edit').classList.add('open');
};
document.getElementById('sheet-name-input').addEventListener('input', (e) => {
  document.getElementById('sheet-name-display').textContent = e.target.value.trim() || 'someone new';
});

document.getElementById('sheet-confirm').onclick = async () => {
  const errEl = document.getElementById('sheet-err');
  errEl.textContent = '';
  const name = document.getElementById('sheet-name-input').value.trim();
  const amount = Number(document.getElementById('sheet-amount').value);
  if (!name) { errEl.textContent = 'Enter your name to bid.'; return; }
  if (!amount || amount <= 0) { errEl.textContent = 'Enter a bid amount.'; return; }

  const btn = document.getElementById('sheet-confirm');
  btn.disabled = true;
  localStorage.setItem('auction_name', name);

  const itemRef = db.collection('items').doc(sheetItem.id);
  const bidRef = itemRef.collection('bids').doc();
  const limitRef = db.collection('bidLimits').doc(getDeviceId());
  try {
    await db.runTransaction(async (tx) => {
      const doc = await tx.get(itemRef);
      if (!doc.exists) throw new Error('This lot no longer exists.');
      const it = doc.data();
      if (it.active === false) throw new Error('Bidding on this lot has just closed.');
      const minNext = it.currentBid + it.increment;
      if (amount < minNext) throw new Error(`Someone beat you to it — bid must now be at least ${money(minNext)}.`);
      tx.update(itemRef, {
        currentBid: amount, currentBidderName: name,
        currentBidderUid: googleUser ? googleUser.uid : null,
        bidCount: (it.bidCount || 0) + 1,
      });
      tx.set(bidRef, {
        name, amount, uid: googleUser ? googleUser.uid : null,
        isGoogle: !!googleUser, deviceId: getDeviceId(),
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      });
      // Server-enforced cooldown — see firestore.rules. If this device bid
      // within the last few seconds, this write (and so the whole
      // transaction) gets rejected atomically.
      tx.set(limitRef, { lastBidAt: firebase.firestore.FieldValue.serverTimestamp() });
    });
    recordMyBid(sheetItem.id, bidRef.id, amount);
    closeBidSheet();
    document.getElementById('success-msg').textContent =
      `Your bid of ${money(amount)} has been placed on ${sheetItem.title}.`;
    document.getElementById('success-overlay').classList.add('open');
  } catch (e) {
    if (e.code === 'permission-denied') {
      errEl.textContent = "You're bidding too fast — wait a few seconds and try again.";
    } else {
      errEl.textContent = e.message || 'Could not place that bid — try again.';
    }
  } finally {
    btn.disabled = false;
  }
};

document.getElementById('success-view').onclick = () => {
  document.getElementById('success-overlay').classList.remove('open');
  openItem(currentItemId);
};
document.getElementById('success-browse').onclick = () => {
  document.getElementById('success-overlay').classList.remove('open');
  showView('home');
};

// -----------------------------------------------------------------
// My Bids
// -----------------------------------------------------------------
document.querySelectorAll('#mybids-tabs .tab').forEach(t => t.onclick = () => {
  mybidsTab = t.dataset.tab;
  document.querySelectorAll('#mybids-tabs .tab').forEach(x => x.classList.toggle('on', x === t));
  renderMyBids();
});

function renderMyBids() {
  const mine = getMyBids();
  const rows = mine.map(m => {
    const it = lots.find(l => l.id === m.itemId);
    if (!it) return null;
    const closed = it.active === false;
    let bucket = 'active', statusText = 'Current highest bid', statusClass = '';
    if (closed) {
      if (it.winnerBidId) {
        if (it.winnerBidId === m.bidId) { bucket = 'won'; statusText = 'You won this item!'; statusClass = 'won'; }
        else { bucket = 'lost'; statusText = `Won by ${it.currentBidderName || 'another bidder'}`; statusClass = 'lost'; }
      } else {
        bucket = 'active'; statusText = 'Results pending';
      }
    }
    return { it, m, bucket, statusText, statusClass, closed };
  }).filter(Boolean).sort((a, b) => b.m.ts - a.m.ts);

  document.querySelectorAll('#mybids-tabs .tab').forEach(t => {
    const n = rows.filter(r => r.bucket === t.dataset.tab).length;
    t.textContent = t.dataset.tab[0].toUpperCase() + t.dataset.tab.slice(1) + (n ? ` (${n})` : '');
  });

  const shown = rows.filter(r => r.bucket === mybidsTab);
  document.getElementById('mybids-empty').style.display = shown.length ? 'none' : 'block';
  document.getElementById('mybids-list').innerHTML = shown.map(r => `
    <div class="biditem" data-id="${r.it.id}">
      <img src="${r.it.imageUrl || ''}" onerror="this.style.visibility='hidden'">
      <div class="b">
        <p class="t">${escapeHtml(r.it.title)}</p>
        <p class="p">${money(r.it.currentBid)}</p>
        <p class="s ${r.statusClass}">${r.statusText}${!r.closed ? ' · ' + gridTimeLabel(r.it) : ''}</p>
      </div>
      <span class="chev">${ICONS.chev}</span>
    </div>`).join('');
  document.querySelectorAll('#mybids-list .biditem').forEach(el => el.onclick = () => openItem(el.dataset.id));
}

// -----------------------------------------------------------------
// Profile
// -----------------------------------------------------------------
function renderProfile() {
  document.getElementById('profile-name').value = localStorage.getItem('auction_name') || '';
  const gwrap = document.getElementById('profile-google');
  if (googleUser) {
    gwrap.innerHTML = `
      <div class="profile-row"><span class="k">Google account</span><span>${escapeHtml(googleUser.displayName || googleUser.email)}</span></div>
      <button class="cta cta-outline" style="margin-top:12px;" id="signout-btn">Sign out</button>`;
    document.getElementById('signout-btn').onclick = () => auth.signOut();
  } else {
    gwrap.innerHTML = `
      <p style="font-size:13px;color:var(--muted);margin:0 0 12px;">Optional — ties your name to a real Google account for high-value lots.</p>
      <button class="cta cta-outline" id="signin-btn">Sign in with Google</button>`;
    document.getElementById('signin-btn').onclick = () => auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
  }
}
document.getElementById('profile-name').addEventListener('change', (e) => {
  localStorage.setItem('auction_name', e.target.value.trim());
});
document.getElementById('clear-bids-btn').onclick = () => {
  if (confirm('Clear your local bid history on this device? This only affects what "My Bids" shows you — it does not withdraw any bids.')) {
    localStorage.removeItem('my_bids');
    renderMyBids();
  }
};
</script>
