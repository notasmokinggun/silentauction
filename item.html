<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redirecting…</title>
<style>html,body{margin:0;background:#0E0C0A;}</style>
<style>
#page-loader{position:fixed;inset:0;z-index:99999;background:#0D0A08;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .25s ease;}
#page-loader.done{opacity:0;pointer-events:none;}
#page-loader .pl-spin{width:46px;height:46px;border-radius:50%;border:4px solid #2E2820;border-top-color:#E3B75C;animation:pl-rot 1s linear infinite;}
#page-loader p{margin:18px 0 0;font:500 17px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#CBC0AF;}
@keyframes pl-rot{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){#page-loader .pl-spin{animation-duration:3s;}#page-loader{transition:none;}}
</style>
</head>
<body>
<div id="page-loader" role="status" aria-live="polite"><div class="pl-spin"></div><p>Loading&hellip;</p></div>
<script>
  // The bid flow now lives in index.html. Kept only so QR codes printed
  // before this change (pointing at item.html?id=...) still work.
  location.replace('index.html' + location.search);
</script>
</body>
</html>
